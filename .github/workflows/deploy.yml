name: Botnik Deploy

on:
  push:
    branches: [master]
    paths:
      - 'data/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_LeS342OoSSK3GbJuTTKRc6LF
          VERCEL_PROJECT_ID: prj_StpTr1CY72FC1hdqijT7RN7XAZpq
        run: |
          set -x
          echo "=== VERCEL ENV CHECK ==="
          echo "VERCEL_ORG_ID: $VERCEL_ORG_ID"
          echo "VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID"
          echo "Token length: ${#VERCEL_TOKEN}"
          echo "=== VERCEL VERSION ==="
          npx vercel --version
          echo "=== VERCEL BUILD ==="
          npx vercel build --prod --token="$VERCEL_TOKEN" 2>&1 || echo "BUILD FAILED with exit code $?"
          echo "=== VERCEL DEPLOY ==="
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 || echo "DEPLOY FAILED with exit code $?"
